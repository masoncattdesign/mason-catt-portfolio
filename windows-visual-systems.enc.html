<style>
:root{--bg:#0e0d0c;--bg3:#1e1c18;--cream:#f0ebe2;--cream2:#b8b0a4;--cream3:#6b6560;--accent:#22c55e;--border2:rgba(240,235,226,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(420px,100%)}
.k{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.bolt{width:13px;height:13px;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M15.82%201.5L5.98%2012.56L9.27%2013.91L7.55%2022.5L18.02%2010.28L14.57%209.52Z'%20fill='%23000'%20stroke='%23000'%20stroke-width='2'%20stroke-linejoin='round'/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Cpath%20d='M15.82%201.5L5.98%2012.56L9.27%2013.91L7.55%2022.5L18.02%2010.28L14.57%209.52Z'%20fill='%23000'%20stroke='%23000'%20stroke-width='2'%20stroke-linejoin='round'/%3E%3C/svg%3E") center/contain no-repeat}
h1{font:400 44px/1.1 'Libre Baskerville',Georgia,serif;letter-spacing:-.02em;margin:18px 0 12px}
p.d{margin:0 0 28px;color:var(--cream2);font-weight:300;font-size:16px;line-height:1.6}
form{display:flex;gap:10px}
input[type=password]{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--border2);background:var(--bg3);color:var(--cream);padding:0 16px;font:400 16px 'DM Sans',system-ui,sans-serif;outline:none}
input[type=password]:focus{border-color:rgba(34,197,94,.55);box-shadow:0 0 0 4px rgba(34,197,94,.12)}
button{height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--accent);color:#0e0d0c;font:500 15px 'DM Sans',system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.rem{display:flex;align-items:center;gap:9px;margin-top:16px;font-size:14px;color:var(--cream3);cursor:pointer}
.rem input{accent-color:var(--accent)}
#msg{min-height:22px;margin:16px 0 0;font-size:14px;color:var(--cream3)}
#msg.err{color:#e0915a}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>

</div></main>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const K = 'mc-key-' + P.salt.slice(0, 12);
const stores = () => { const s = []; try { s.push(sessionStorage); } catch (e) {} try { s.push(localStorage); } catch (e) {} return s; };
const norm = v => (v || '').trim().toLowerCase().replace(/\s+/g, '');
async function derive(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(P.salt), iterations: P.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);

async function decrypt(key) { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(P.iv) }, key, b(P.ct))); }
async function keep(key, remember) {
  const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));

  if (remember) { try { localStorage.setItem(K, raw); } catch (_) {} }
}

async function show(html) {

const f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
