<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Windows System Personalization — Scene</title>
<style>
  /* ============================================================
     Windows System Personalization — Project Card Scene
     - Animated SVG perspective grid (subtle drift)
     - Layered PNG assets with blur-to-focus staggered reveal
     - Gentle hover parallax (mouse-driven, GPU-friendly)
     ============================================================ */

  :root {
    --bg-page: #0a0d0b;
    --bg-card: #0c1410;
    --stroke-card: rgba(140, 200, 160, 0.10);
    --grid-green: #2d8a4a;
    --grid-green-soft: rgba(45, 138, 74, 0.55);
    --radius-card: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-page);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  /* ---- Card container (right-half of your portfolio project tile) ---- */
  .scene-card {
    position: relative;
    width: 100%;
    max-width: 820px;
    aspect-ratio: 16 / 7.2;
    border-radius: var(--radius-card);
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--stroke-card);
    isolation: isolate;
    cursor: pointer;
    /* Parallax origin transform from JS */
    --mx: 0;
    --my: 0;
  }

  /* ---- Layer 1: Animated SVG perspective grid ---- */
  .grid-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    transform:
      translate3d(calc(var(--mx) * -8px), calc(var(--my) * -6px), 0)
      scale(1.04);
    transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Subtle continuous drift of the grid */
  .grid-bg svg {
    width: 100%;
    height: 100%;
    display: block;
    animation: gridDrift 18s ease-in-out infinite;
    transform-origin: center center;
  }

  @keyframes gridDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25%      { transform: translate(-6px, 2px) scale(1.005); }
    50%      { transform: translate(2px, -4px) scale(1.01); }
    75%      { transform: translate(4px, 3px) scale(1.005); }
  }

  /* Subtle vignette to deepen the corners */
  .scene-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center,
        rgba(0,0,0,0) 35%,
        rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ---- Floating layers (PNG assets) ---- */
  .layer {
    position: absolute;
    z-index: 3;
    will-change: transform, filter, opacity;
    opacity: 0;
    filter: blur(24px);
    transform: translate3d(0, 0, 0) scale(0.96);
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    animation-duration: 1100ms;
    transition:
      transform 700ms cubic-bezier(0.22, 1, 0.36, 1),
      filter 400ms ease;
  }

  /* Blur-to-focus reveal keyframes */
  @keyframes focusIn {
    0%   { opacity: 0;   filter: blur(24px); transform: translate3d(0,0,0) scale(0.96); }
    60%  { opacity: 1;   filter: blur(6px);  }
    100% { opacity: 1;   filter: blur(0);    transform: translate3d(0,0,0) scale(1); }
  }

  /* Each layer with its own delay + parallax depth */
  /* Wallpaper preview — back layer (smallest parallax) */
  .layer.wallpaper {
    top: 18%;
    left: 22%;
    width: 56%;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.45),
      0 4px 14px rgba(0, 0, 0, 0.3);
    animation-name: focusIn;
    animation-delay: 200ms;
    --depth: 6;
  }
  .layer.wallpaper img { width: 100%; height: auto; display: block; }

  /* App grid tile — top right, mid depth */
  .layer.app-grid {
    top: 14%;
    right: 14%;
    width: 18%;
    animation-name: focusIn;
    animation-delay: 500ms;
    --depth: 14;
    filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
  }
  .layer.app-grid img { width: 100%; height: auto; display: block; }

  /* Chat icon — center-left, frontmost (biggest parallax) */
  .layer.chat-icon {
    top: 28%;
    left: 14%;
    width: 22%;
    animation-name: focusIn;
    animation-delay: 750ms;
    --depth: 22;
    filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.55));
  }
  .layer.chat-icon img { width: 100%; height: auto; display: block; }

  /* Seed / mode pill — bottom right, mid-front */
  .layer.seed-pill {
    bottom: 14%;
    right: 8%;
    width: 28%;
    animation-name: focusIn;
    animation-delay: 950ms;
    --depth: 18;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.5));
  }
  .layer.seed-pill img { width: 100%; height: auto; display: block; }

  /* Parallax: apply the mouse-driven translate using per-layer --depth */
  .layer {
    transform:
      translate3d(
        calc(var(--mx) * var(--depth, 8) * 1px),
        calc(var(--my) * var(--depth, 8) * 1px),
        0
      );
  }

  /* While the entrance animation runs, keyframes win over the inline transform.
     After it finishes (animation-fill-mode: forwards), the parallax transform
     applies cleanly. */

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .grid-bg svg { animation: none; }
    .layer {
      animation: none !important;
      opacity: 1;
      filter: none;
      transform: none;
    }
  }
</style>
</head>
<body>

  <div class="scene-card" id="scene">

    <!-- ============================================================
         Layer 1: Animated SVG perspective grid background
         Inspired by a 3D "room" / corridor view: floor + ceiling +
         left & right walls all converging toward a central horizon.
         ============================================================ -->
    <div class="grid-bg" aria-hidden="true">
      <svg viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice"
           xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Soft fade so grid lines disappear at the center horizon -->
          <radialGradient id="centerFade" cx="50%" cy="50%" r="42%">
            <stop offset="0%"   stop-color="#000" stop-opacity="1"/>
            <stop offset="55%"  stop-color="#000" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0"/>
          </radialGradient>
          <mask id="fadeMask">
            <rect width="1600" height="720" fill="white"/>
            <rect width="1600" height="720" fill="url(#centerFade)"/>
          </mask>

          <!-- Slight glow on grid lines -->
          <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="0.6" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Base black backdrop -->
        <rect width="1600" height="720" fill="#000"/>

        <!-- The perspective grid group, masked to fade near center -->
        <g stroke="var(--grid-green)" stroke-width="1.1"
           fill="none" filter="url(#glow)" mask="url(#fadeMask)">

          <!-- ===== FLOOR (bottom half) — lines converging to center ===== -->
          <!-- Horizontal floor lines (further = closer to horizon) -->
          <g opacity="0.85">
            <line x1="0"    y1="720" x2="1600" y2="720"/>
            <line x1="80"   y1="640" x2="1520" y2="640"/>
            <line x1="160"  y1="580" x2="1440" y2="580"/>
            <line x1="240"  y1="540" x2="1360" y2="540"/>
            <line x1="320"  y1="510" x2="1280" y2="510"/>
            <line x1="400"  y1="490" x2="1200" y2="490"/>
            <line x1="470"  y1="475" x2="1130" y2="475"/>
            <line x1="540"  y1="465" x2="1060" y2="465"/>
            <line x1="610"  y1="458" x2="990"  y2="458"/>
          </g>
          <!-- Floor receding lines (verticals converging) -->
          <g opacity="0.9">
            <line x1="0"    y1="720" x2="800"  y2="450"/>
            <line x1="160"  y1="720" x2="800"  y2="450"/>
            <line x1="320"  y1="720" x2="800"  y2="450"/>
            <line x1="480"  y1="720" x2="800"  y2="450"/>
            <line x1="640"  y1="720" x2="800"  y2="450"/>
            <line x1="800"  y1="720" x2="800"  y2="450"/>
            <line x1="960"  y1="720" x2="800"  y2="450"/>
            <line x1="1120" y1="720" x2="800"  y2="450"/>
            <line x1="1280" y1="720" x2="800"  y2="450"/>
            <line x1="1440" y1="720" x2="800"  y2="450"/>
            <line x1="1600" y1="720" x2="800"  y2="450"/>
          </g>

          <!-- ===== CEILING (top half) — mirror of floor ===== -->
          <g opacity="0.85">
            <line x1="0"    y1="0"   x2="1600" y2="0"/>
            <line x1="80"   y1="80"  x2="1520" y2="80"/>
            <line x1="160"  y1="140" x2="1440" y2="140"/>
            <line x1="240"  y1="180" x2="1360" y2="180"/>
            <line x1="320"  y1="210" x2="1280" y2="210"/>
            <line x1="400"  y1="230" x2="1200" y2="230"/>
            <line x1="470"  y1="245" x2="1130" y2="245"/>
            <line x1="540"  y1="255" x2="1060" y2="255"/>
            <line x1="610"  y1="262" x2="990"  y2="262"/>
          </g>
          <g opacity="0.9">
            <line x1="0"    y1="0" x2="800" y2="270"/>
            <line x1="160"  y1="0" x2="800" y2="270"/>
            <line x1="320"  y1="0" x2="800" y2="270"/>
            <line x1="480"  y1="0" x2="800" y2="270"/>
            <line x1="640"  y1="0" x2="800" y2="270"/>
            <line x1="800"  y1="0" x2="800" y2="270"/>
            <line x1="960"  y1="0" x2="800" y2="270"/>
            <line x1="1120" y1="0" x2="800" y2="270"/>
            <line x1="1280" y1="0" x2="800" y2="270"/>
            <line x1="1440" y1="0" x2="800" y2="270"/>
            <line x1="1600" y1="0" x2="800" y2="270"/>
          </g>

          <!-- ===== LEFT WALL — horizontals converge right, verticals stack ===== -->
          <g opacity="0.85">
            <line x1="0"   y1="0"   x2="0"   y2="720"/>
            <line x1="80"  y1="60"  x2="80"  y2="660"/>
            <line x1="160" y1="120" x2="160" y2="600"/>
            <line x1="240" y1="170" x2="240" y2="550"/>
            <line x1="320" y1="205" x2="320" y2="515"/>
            <line x1="400" y1="228" x2="400" y2="492"/>
            <line x1="470" y1="244" x2="470" y2="476"/>
            <line x1="540" y1="254" x2="540" y2="466"/>
          </g>
          <g opacity="0.9">
            <line x1="0"   y1="0"   x2="800" y2="270"/>
            <line x1="0"   y1="120" x2="800" y2="320"/>
            <line x1="0"   y1="240" x2="800" y2="360"/>
            <line x1="0"   y1="360" x2="800" y2="400"/>
            <line x1="0"   y1="480" x2="800" y2="420"/>
            <line x1="0"   y1="600" x2="800" y2="440"/>
            <line x1="0"   y1="720" x2="800" y2="450"/>
          </g>

          <!-- ===== RIGHT WALL — mirror of left ===== -->
          <g opacity="0.85">
            <line x1="1600" y1="0"   x2="1600" y2="720"/>
            <line x1="1520" y1="60"  x2="1520" y2="660"/>
            <line x1="1440" y1="120" x2="1440" y2="600"/>
            <line x1="1360" y1="170" x2="1360" y2="550"/>
            <line x1="1280" y1="205" x2="1280" y2="515"/>
            <line x1="1200" y1="228" x2="1200" y2="492"/>
            <line x1="1130" y1="244" x2="1130" y2="476"/>
            <line x1="1060" y1="254" x2="1060" y2="466"/>
          </g>
          <g opacity="0.9">
            <line x1="1600" y1="0"   x2="800" y2="270"/>
            <line x1="1600" y1="120" x2="800" y2="320"/>
            <line x1="1600" y1="240" x2="800" y2="360"/>
            <line x1="1600" y1="360" x2="800" y2="400"/>
            <line x1="1600" y1="480" x2="800" y2="420"/>
            <line x1="1600" y1="600" x2="800" y2="440"/>
            <line x1="1600" y1="720" x2="800" y2="450"/>
          </g>
        </g>

        <!-- Soft horizon glow / haze at the center -->
        <ellipse cx="800" cy="360" rx="320" ry="120"
                 fill="var(--grid-green)" opacity="0.05"/>
      </svg>
    </div>

    <!-- ============================================================
         Layer 2-5: Floating image assets
         Order in DOM matches z-stack: back → front.
         ============================================================ -->

    <!-- Back layer: blurred wallpaper preview window -->
    <div class="layer wallpaper">
      <img src="assets/wallpaper.png" alt="Personalized wallpaper preview" />
    </div>

    <!-- Mid layer: app-grid tile (top right) -->
    <div class="layer app-grid">
      <img src="assets/app-grid.png" alt="App tinting grid" />
    </div>

    <!-- Front layer: bottom-right seed / mode pill -->
    <div class="layer seed-pill">
      <img src="assets/seed-pill.png" alt="Seed and mode indicator" />
    </div>

    <!-- Frontmost: chat icon (large green chat bubble) -->
    <div class="layer chat-icon">
      <img src="assets/chat-icon.png" alt="Themed chat app icon" />
    </div>

  </div>

<script>
  /* ============================================================
     Hover parallax — gentle, GPU-friendly.
     Each layer sets --depth in CSS; here we only set --mx, --my
     on the card element. CSS does the math.
     Range: -1 .. +1 for x and y, smoothed with rAF.
     ============================================================ */
  (function () {
    const card  = document.getElementById('scene');
    if (!card) return;

    let targetX = 0, targetY = 0;
    let currX   = 0, currY   = 0;
    let rafId   = null;
    let active  = false;

    const onMove = (e) => {
      const rect = card.getBoundingClientRect();
      const cx = rect.left + rect.width  / 2;
      const cy = rect.top  + rect.height / 2;
      // Normalize: -1 (left/top) → +1 (right/bottom)
      targetX = ((e.clientX - cx) / (rect.width  / 2));
      targetY = ((e.clientY - cy) / (rect.height / 2));
      // Clamp
      targetX = Math.max(-1, Math.min(1, targetX));
      targetY = Math.max(-1, Math.min(1, targetY));
      if (!active) loop();
    };

    const onLeave = () => {
      targetX = 0;
      targetY = 0;
      if (!active) loop();
    };

    const loop = () => {
      active = true;
      // Easing toward target
      currX += (targetX - currX) * 0.08;
      currY += (targetY - currY) * 0.08;
      card.style.setProperty('--mx', currX.toFixed(4));
      card.style.setProperty('--my', currY.toFixed(4));

      // Stop the loop when close enough to target & target is 0
      if (
        Math.abs(currX - targetX) < 0.001 &&
        Math.abs(currY - targetY) < 0.001 &&
        targetX === 0 && targetY === 0
      ) {
        active = false;
        cancelAnimationFrame(rafId);
        return;
      }
      rafId = requestAnimationFrame(loop);
    };

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);
  })();
</script>
</body>
</html>
